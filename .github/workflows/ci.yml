name: C++ CI
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: cvcascade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Conan build and tests (self-hosted Linux)
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Conan 2
        run: python -m pip install --upgrade "conan>=2.0,<3.0"
      - name: Detect Conan profile
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo env "PATH=$PATH" conan profile detect --force
          else
            conan profile detect --force
          fi
      - name: Resolve Conan dependencies, build, package and test
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo env "PATH=$PATH" conan create . --build=missing -s build_type=Release -c tools.system.package_manager:mode=install
          else
            conan create . --build=missing -s build_type=Release -c tools.system.package_manager:mode=install
          fi
