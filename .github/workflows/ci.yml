name: C++ CI
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: lukka/get-cmake@latest
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libocct-foundation-dev libocct-modeling-data-dev libocct-modeling-algorithms-dev libocct-data-exchange-dev libopencv-dev
      - name: Install Conan
        run: python -m pip install "conan>=2.0,<3.0"
      - name: Configure Conan dependencies
        run: conan install . --output-folder=build --build=missing -s build_type=Release
      - name: Configure CMake
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=build/build/Release/generators/conan_toolchain.cmake -DCVCASCADE_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
