name: C++ CI
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: cvcascade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Conan build and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Conan 2
        run: python -m pip install --upgrade "conan>=2.0,<3.0"
      - name: Detect Conan profile
        run: conan profile detect --force
      - name: Resolve Conan dependencies, build, package and test
        run: conan create . --build=missing -s build_type=Release -c tools.system.package_manager:mode=install
